<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalog Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
<link rel="stylesheet" href="catalog-tree.css">
<style>
  /* Layout: one screen. Thin chrome bar top and bottom, the tree fills the middle. */
  :root {
    --bg: #fbfbfa;
    --fg: #141414;
    --muted: #8d8d89;
    --rule: #e6e6e3;
    --pill: #ffffff;
    --font: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121211; --fg: #ededea; --muted: #7c7c78; --rule: #2a2a28; --pill: #1b1b1a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #121211; --fg: #ededea; --muted: #7c7c78; --rule: #2a2a28; --pill: #1b1b1a; color-scheme: dark; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }
  .bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding-block: 14px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    font-size: 13px;
  }
  .bar nav { display: flex; gap: 18px; }
  .bar .end { justify-self: end; }
  .bar a { color: inherit; text-decoration: none; }
  .bar a:hover { opacity: 0.6; }
  .studio { text-align: center; line-height: 1.15; }
  .pill { padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--pill); }
  .muted { color: var(--muted); }
  #tree { min-height: 0; }
  footer.bar { grid-template-columns: 1fr auto; }

  /* component tokens, mapped to the page theme */
  .ct-host {
    --ct-bg: var(--bg);
    --ct-text: var(--fg);
    --ct-pill-bg: var(--pill);
    --ct-pill-border: var(--rule);
    --ct-pill-border-active: var(--fg);
    --ct-line-hot: var(--fg);
    --ct-font: var(--font);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ct-host { --ct-muted: #5f5f5b; --ct-count: #55554f; --ct-line: #3b3b38; --ct-trunk: #2f2f2c; --ct-thumb-bg: #232321; --ct-stage-bg: #1e1e1c; --ct-overlay: rgba(18,18,17,.55); --ct-shadow: 0 14px 34px -12px rgba(0,0,0,.7); }
  }
  :root[data-theme="dark"] .ct-host { --ct-muted: #5f5f5b; --ct-count: #55554f; --ct-line: #3b3b38; --ct-trunk: #2f2f2c; --ct-thumb-bg: #232321; --ct-stage-bg: #1e1e1c; --ct-overlay: rgba(18,18,17,.55); --ct-shadow: 0 14px 34px -12px rgba(0,0,0,.7); }

  @media (max-width: 560px) {
    .bar nav.hide-sm { display: none; }
    .bar { grid-template-columns: 1fr auto; }
    .studio { text-align: left; }
  }
</style>

<header class="bar" id="chrome-top">
  <nav class="hide-sm"><a href="#">About</a><a href="#">Contact</a></nav>
  <div class="studio">Field Office<br><span class="muted">brand &amp; product design</span></div>
  <nav class="end"><a href="#">Projects</a><span class="pill">Catalog</span></nav>
</header>

<main id="tree" aria-label="Project catalog"></main>

<footer class="bar" id="chrome-bottom">
  <span class="muted">Pick a branch. Hover to preview, click to open.</span>
  <span class="end muted">catalog-tree v1.0</span>
</footer>

<script src="demo-data.js"></script>
<script src="catalog-tree.js"></script>
<script>
  CatalogTree.mount('#tree', {
    rootLabel: 'Catalog',
    categories: DEMO_CATALOG.categories,
    items: DEMO_CATALOG.items,
    initial: 'digital',
    blurTargets: [document.getElementById('chrome-bottom')]
  });
</script>
